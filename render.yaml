services:
  - type: web
    name: excel-ai-categorizer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Maxfiy — qiymat repoda emas, Render dashboard'da kiritiladi.
      - key: Ai__ApiKey
        sync: false
